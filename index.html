<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css" />
  <title>Capital Quiz</title>
  
</head>
<body>
  <header>

  </header>
  <div class="quiz-container">
    <div id="some"></div>
    <h2 id="question"></h2>
    <div class="flag-image">
    	<img id="flag" class="flag" src="" alt="Country flag" />
    </div>
    <div id="details"></div>
    <div id="options" class="options"></div>
    <button id="nextButton" class="next-button" style="display:none;">Next</button>
    <div id="result"></div>
    <div id="answer"></div>
  </div>

  <script>
    let countries = [];
    let quizData = [];
    let currentIndex = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const flagEl = document.getElementById("flag");
    const optionsEl = document.getElementById("options");
    const nextButton = document.getElementById("nextButton");
    const resultEl = document.getElementById("result");
    const answerEL = document.getElementById("answer");
    const details = document.getElementById("details");

    async function fetchCountries() {
      try {
        const response = await fetch('https://restcountries.com/v3.1/all');
        const data = await response.json();
        countries = data.filter(country => country.capital && country.capital.length > 0);
        generateQuizData();
        loadQuestion();
      } catch (error) {
        console.error('Error fetching countries:', error);
      }
    }

    function generateQuizData() {
      const selectedCountries = [];
      while (selectedCountries.length < 30) {
        const randomIndex = Math.floor(Math.random() * countries.length);
        const country = countries[randomIndex];
        if (!selectedCountries.includes(country)) {
          selectedCountries.push(country);
        }
      }

      quizData = selectedCountries.map(country => {
        const correctCapital = country.capital[0];
        const options = [correctCapital];
        while (options.length < 4) {
          const randomCountry = countries[Math.floor(Math.random() * countries.length)];
          const capital = randomCountry.capital[0];
          if (!options.includes(capital)) {
            options.push(capital);
          }
        }
        shuffleArray(options);
        return {
          country: country.name.common,
          official: country.name.official,
          currency : country.currencies || {},
          continent : country.region,
          subregion : country.subregion,
          capital: correctCapital,
          options: options,
          flag: country.flags.svg
        };
      });
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function loadQuestion() {
      const current = quizData[currentIndex];
      questionEl.textContent = ` ${current.country}`;
      var curr = Object.values(current.currency)[0]?.name || "Unknown";
      if(current.continent == "Americas")
        current.continent = current.subregion
      details.innerHTML = 
      "Official Name : " + current.official  + 
      "<br>Continent : " + current.continent + 
      "<br>Currency : " + curr;
      flagEl.src = current.flag;
      optionsEl.innerHTML = "";
	    resultEl.innerHTML = "";
      resultEl.classList.remove("correct");
      resultEl.classList.remove("wrong");
      answerEL.textContent = "";
      nextButton.style.display = "none";

      current.options.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = option;
        btn.onclick = () => handleAnswer(option);
        optionsEl.appendChild(btn);
      });
    }

    function handleAnswer(selected) {
      const current = quizData[currentIndex];
      const buttons = optionsEl.querySelectorAll("button");

      buttons.forEach(button => {
        button.disabled = true;
        if (selected === current.capital) {
          resultEl.innerHTML = "<i class='bi bi-check-circle-fill'></i> " + current.capital;
          resultEl.classList.add("correct");
        } else  {
          resultEl.innerHTML = "<i class='bi bi-x-circle-fill'></i> " + current.capital;
          resultEl.classList.add("wrong")
          
        }
      });

      if (selected === current.capital) {
        score++;
      }
		setTimeout(() => {
		loadNextQuestion();
		}, 3000);

      
    }

	function loadNextQuestion()
	{
		currentIndex++;
      if (currentIndex < quizData.length) {
        loadQuestion();
      } else {
        questionEl.textContent = "Quiz Completed!";
        flagEl.style.display = "none";
        optionsEl.innerHTML = "";
        nextButton.style.display = "none";
        resultEl.innerHTML = `<strong>Your score: ${score} / ${quizData.length}</strong>`;
      }
	}
    

    fetchCountries();
  </script>
</body>
</html>
